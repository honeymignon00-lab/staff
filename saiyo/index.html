<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="採用管理">
<title>採用管理</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="app" title="採用管理" allow="clipboard-write"></iframe>
<script>
(function () {
  var base = "https://script.google.com/macros/s/AKfycbxB_yWpgQFzuixLszqvGxVdYbrGUonxIy4k1-Um1nEf-ii2ka2aVuVvBitEjqafvkn_tA/exec";
  var extra = location.search ? location.search.slice(1) : "";
  /* この端末でMignuanceを開いたことがあれば（＝正貴さん）、左メニューに「Mignuance」に戻るボタンを出す */
  try { if (localStorage.getItem("mignuance_k")) extra = (extra ? extra + "&" : "") + "ms=1"; } catch (e) {}
  var url = extra ? base + (base.indexOf("?") < 0 ? "?" : "&") + extra : base;
  document.getElementById("app").src = url + location.hash;
})();
</script>
</body>
</html>

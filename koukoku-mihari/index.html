<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="広告の見張り">
<title>広告の見張り（いま出している広告）</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f6f4f1; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="app" title="広告の見張り" allow="clipboard-write"></iframe>
<script>
/*
 * 広告の見張り（いま出している広告を1画面で見る）の入口（2026-11-18）。中身は広告判断アプリの ?p=all。
 * アプリの修正はGAS側だけでよい（この入口は変えなくてよい）。
 */
(function () {
  var base = "https://script.google.com/macros/s/AKfycbweT95vY-mO03W4hc18dNdffM8BF-tIBYcH2M9K-qSPiu5gYgYpsmhWhkZL6knSf1gY/exec";
  var extra = "p=all" + (location.search ? "&" + location.search.slice(1) : "");
  try { if (localStorage.getItem("mignuance_k")) extra = (extra ? extra + "&" : "") + "ms=1"; } catch (e) {}
  var url = extra ? base + (base.indexOf("?") < 0 ? "?" : "&") + extra : base;
  document.getElementById("app").src = url + location.hash;
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mignuance">
<title>今日｜Mignuance</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F3F4F8; overflow: hidden; }
  @media (prefers-color-scheme: dark) { html, body { background: #0F1118; } }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  /* はめ込みで開けないとき用の小さな逃げ道（左下） */
  #direct { position: fixed; left: 10px; bottom: 8px; font: 11px/1.4 system-ui, sans-serif; color: #8A91A4; text-decoration: none; opacity: .55; z-index: 2; }
  #direct:hover { opacity: 1; text-decoration: underline; }
</style>
</head>
<body>
<iframe id="app" title="Mignuance" allow="clipboard-write"></iframe>
<a id="direct" target="_top" rel="noopener">開けないときはこちら</a>
<script>
(function () {
  /* 中身はApps Scriptのウェブアプリ（アクセス＝本人のみ）。ここは入口だけ */
  var base = "https://script.google.com/macros/s/AKfycbw8eWSgkGwNVdWxgAD1J1ScULO4AcmR-Xw36S2rfkC1_ONp-toWte0olhW3FnXj2eq6/exec";
  var extra = location.search ? location.search.slice(1) : "";
  var url = extra ? base + "?" + extra : base;
  document.getElementById("app").src = url + location.hash;
  document.getElementById("direct").href = url;
  /* アプリ側から届くタブ名（要対応の件数つき）を、このタブに反映する */
  window.addEventListener("message", function (e) {
    if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
    var t = e.data && e.data.mignuanceTitle;
    if (typeof t === "string" && t.length < 80) document.title = t;
  });
})();
</script>
</body>
</html>

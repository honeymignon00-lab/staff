<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="プライベート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="manifest" href="manifest.webmanifest">
<title>プライベート</title>
<link rel="icon" type="image/png" href="icon-512-v2.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F4F3EF; overflow: hidden; }
  @media (prefers-color-scheme: dark) { html, body { background: #0F1118; } }
  #wrap { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; bottom: env(safe-area-inset-bottom); }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* はめ込みで開けないとき用の小さな逃げ道（左下） */
  #direct { position: fixed; left: 10px; bottom: 8px; font: 11px/1.4 system-ui, sans-serif; color: #8A91A4; text-decoration: none; opacity: .55; z-index: 2; }
  #direct:hover { opacity: 1; text-decoration: underline; }
  /* スマホでは下のタブと重なるので出さない */
  @media (max-width: 760px) { #direct { display: none; } }
  /* ホーム画面のアイコンのバッジを有効にするボタン（通知が未許可のときだけ出る） */
  #badgeOn { display: none; position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: 50%; transform: translateX(-50%); z-index: 3; font: 13px/1 system-ui, sans-serif; padding: 9px 14px; border-radius: 999px; border: 0; background: #2F3A4A; color: #fff; }
  #badgeOn .x { margin-left: 10px; opacity: .6; }
</style>
</head>
<body>
<div id="wrap"><iframe id="app" title="プライベート" allow="clipboard-write"></iframe></div>
<a id="direct" target="_top" rel="noopener">開けないときはこちら</a>
<button id="badgeOn" type="button">アイコンに公的機関更新の件数を出す<span class="x" id="badgeNo">×</span></button>
<script>
(function () {
  /* 中身はApps Scriptのウェブアプリ（アクセス＝本人のみ）。ここは入口だけ */
  var base = "https://script.google.com/macros/s/AKfycbw8eWSgkGwNVdWxgAD1J1ScULO4AcmR-Xw36S2rfkC1_ONp-toWte0olhW3FnXj2eq6/exec";
  var extra = location.search ? location.search.slice(1) : "";
  /* 合言葉（?k=）はこの端末に覚えておき、ほかのアプリの「Mignuanceに戻る」から
     合言葉なしで来たときに付け足す（2026-10-25） */
  try {
    var qk = new URLSearchParams(extra).get("k");
    if (qk) localStorage.setItem("mignuance_k", qk);
    else {
      var sk = localStorage.getItem("mignuance_k");
      if (sk) extra = "k=" + encodeURIComponent(sk) + (extra ? "&" + extra : "");
    }
  } catch (e) {}
  /* プライベート用の入口：いつも app=private を付けて開く（2026-10-27） */
  if (!/(^|&)app=private(&|$)/.test(extra)) extra = extra ? extra + "&app=private" : "app=private";
  var url = extra ? base + "?" + extra : base;
  document.getElementById("app").src = url + location.hash;
  document.getElementById("direct").href = url;
  /* ホーム画面から全画面で起動した直後は画面の高さが小さく報告されることがあるので、
     読み込み後や画面サイズが変わったときに枠を1px動かして、中身に高さを測り直させる */
  var fr = document.getElementById("app");
  function nudge() {
    fr.style.height = "calc(100% - 1px)";
    setTimeout(function () { fr.style.height = "100%"; }, 120);
  }
  fr.addEventListener("load", function () { setTimeout(nudge, 300); setTimeout(nudge, 1500); });
  window.addEventListener("resize", function () { setTimeout(nudge, 200); });
  window.addEventListener("orientationchange", function () { setTimeout(nudge, 400); });
  window.addEventListener("pageshow", function () { setTimeout(nudge, 300); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) setTimeout(nudge, 300); });
  /* アプリ側から届くタブ名（要対応の件数つき）を、このタブに反映する */
  window.addEventListener("message", function (e) {
    if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
    var t = e.data && e.data.mignuanceTitle;
    if (typeof t === "string" && t.length < 80) document.title = t;
    /* 公的機関更新の「いま手続きが必要」の件数をホーム画面のアイコンのバッジにする（2026-10-30） */
    var n = e.data && e.data.mignuanceBadge;
    if (typeof n === "number") setBadge(n);
  });
  var lastN = null;
  function setBadge(n) {
    lastN = n;
    try {
      if (!("setAppBadge" in navigator)) return;
      if (n > 0) navigator.setAppBadge(n).catch(function () {});
      else navigator.clearAppBadge().catch(function () {});
    } catch (e) {}
  }
  try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }); } catch (e) {}
  /* 通知の許可がまだのとき、ホーム画面から開いた場合だけボタンを出す。×で出さない */
  var btn = document.getElementById("badgeOn");
  try {
    var standalone = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
    if (standalone && "setAppBadge" in navigator && window.Notification && Notification.permission === "default" && localStorage.getItem("mignuance_pv_badge_no") !== "1") btn.style.display = "block";
  } catch (e) {}
  btn.addEventListener("click", function (ev) {
    btn.style.display = "none";
    if (ev.target.id === "badgeNo") { try { localStorage.setItem("mignuance_pv_badge_no", "1"); } catch (e) {} return; }
    Notification.requestPermission().then(function (p) { if (p === "granted" && lastN !== null) setBadge(lastN); });
  });

})();
</script>
</body>
</html>
